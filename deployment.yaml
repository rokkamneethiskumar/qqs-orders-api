
apiVersion: apps/v1
kind: Deployment

metadata:
  name: orders-api
  namespace: orders-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: orders-api

  template:
    metadata:
      labels:
        app: orders-api

    spec:
      imagePullSecrets:
        - name: dockerhub-credentials

      containers:
        - name: orders-api
          image: neethis/qqs-orders-api:1.0
          ports:
            - containerPort: 3000

