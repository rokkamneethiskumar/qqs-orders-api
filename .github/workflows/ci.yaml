
name: Orders API CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # JOB 1: Lint and Test
  build-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test

  # JOB 2: Build and Push Docker Image
  build-and-push:
    name: Build and Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            neethis/qqs-orders-api:1.0
            neethis/qqs-orders-api:latest
            neethis/qqs-orders-api:${{ github.sha }}

  # JOB 3: Deploy to AWS EC2
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Login to Docker Hub on EC2
          printf '%s' "$DOCKERHUB_TOKEN" | ssh \
            -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

          # Pull and deploy the latest image
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" << 'EOF'
              set -e

              docker pull neethis/qqs-orders-api:1.0

              docker stop orders-api || true
              docker rm orders-api || true

              docker run -d \
                --name orders-api \
                -p 3000:3000 \
                --restart unless-stopped \
                neethis/qqs-orders-api:1.0

              docker logout

              echo "Orders API deployment completed"
              docker ps
          EOF

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            "curl --fail http://localhost:3000/health"

